[package]
name = "vela"
version = "0.4.0"
description = "Vela — visor local de PDF y Markdown"
authors = ["Vela"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Capa anti-zoom del pellizco (src-tauri/src/main.rs, módulo `zoom_guard`).
# Mismas versiones que usa Tauri 2 en Linux (gtk 0.18 / webkit2gtk 2.x).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
webkit2gtk = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
